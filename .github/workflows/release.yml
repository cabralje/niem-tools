name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm dependencies
        run: npm ci

      - name: Stamp version from tag
        run: |
          mvn --batch-mode versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/niemtools-signing.p12

      - name: Build, test, generate SBOM, and sign JAR
        run: mvn --batch-mode clean package verify -Psign
        env:
          KEYSTORE_PATH: /tmp/niemtools-signing.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate npm SBOM
        run: npm sbom --sbom-format cyclonedx --package-lock-only > sbom-npm.cdx.json

      - name: Scan SBOM for vulnerabilities (Grype)
        uses: anchore/scan-action@v3
        with:
          sbom: target/niemtools-${{ steps.version.outputs.version }}-sbom.json
          fail-build: false

      - name: Verify JAR signature
        run: jarsigner -verify target/niemtools.jar

      - name: Secure cleanup of keystore
        if: always()
        run: rm -f /tmp/niemtools-signing.p12

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/niemtools.jar
            target/niemtools-${{ steps.version.outputs.version }}-sbom.xml
            target/niemtools-${{ steps.version.outputs.version }}-sbom.json
            sbom-npm.cdx.json

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
